# Spring Datasource Config
spring.datasource.url=jdbc:postgresql://localhost:5432/codeanalyzer
spring.datasource.username=CodeAnalyzer
spring.datasource.password=Apple@123

# Kafka Bootstrap servers
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Kafka Consumer Config
spring.kafka.consumer.group-id=code-analyzer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Producer Config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# JWT Secret (replace with your actual secret key)
security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-please-change-1234567890}

# Server port
server.port=${SERVER_PORT:8080}

analysis.ai-service-url=${ANALYSIS_AI_SERVICE_URL:http://localhost:8000}

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=DEBUG
